limit_req_zone $binary_remote_addr zone=markscan_ai:10m rate=2r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name duongpt.io.vn www.duongpt.io.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name duongpt.io.vn www.duongpt.io.vn;
    root /var/www/remove-watermark/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/duongpt.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duongpt.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /detector-assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ai/ {
        limit_req zone=markscan_ai burst=2 nodelay;
        client_max_body_size 70m;
        proxy_pass http://127.0.0.1:8384/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
